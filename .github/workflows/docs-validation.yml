name: Documentation validation

on:
  push:
    branches: [main, "feature/**"]
    paths: ["**.md", "**.mmd", ".github/workflows/docs-validation.yml"]
  pull_request:
    paths: ["**.md", "**.mmd", ".github/workflows/docs-validation.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-links:
    name: Validate local Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check relative Markdown links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".").resolve()
          files = list(root.rglob("*.md"))
          pattern = re.compile(r"!??\[[^\]]*\]\(([^)]+)\)")
          errors = []

          for source in files:
              content = source.read_text(encoding="utf-8")
              for target in pattern.findall(content):
                  target = target.strip().split()[0].strip("<>")
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  path_part = target.split("#", 1)[0]
                  if not path_part:
                      continue
                  candidate = (source.parent / path_part).resolve()
                  if not candidate.exists():
                      errors.append(f"{source.relative_to(root)} -> {target}")

          if errors:
              print("Broken local Markdown links:")
              print("\n".join(errors))
              sys.exit(1)

          print(f"Validated local Markdown links in {len(files)} files.")
          PY
